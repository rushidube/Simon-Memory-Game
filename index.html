<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <meta name="description" content="A browser-based Simon memory game built with vanilla HTML, CSS, and JavaScript — no frameworks, no build step. Watch the color sequence, repeat it back, and see how far your memory takes you.">
    <meta name="theme-color" content="#10131c">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Simon Game">
    <meta property="og:description" content="A browser-based Simon memory game built with vanilla HTML, CSS, and JavaScript.">

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <h1>Simon Game</h1>

        <div class="scoreboard">
            <div id="level">Level : 0</div>
            <div id="highscore">High Score : 0</div>
        </div>

        <p id="statusMessage" role="status" aria-live="polite" aria-atomic="true">Ready to test your memory?</p>

        <div class="controls">
            <button id="startBtn">Start Game</button>
            <button id="restartBtn">Restart Game</button>
        </div>
        <div class="btn-container" role="group" aria-label="Game pads">
            <div class="board-stage">

                <div class="line-one">
                    <button class="btn red" type="button" id="red" aria-label="Red"></button>
                    <button class="btn yellow" type="button" id="yellow" aria-label="Yellow"></button>
                </div>

                <div class="line-two">
                    <button class="btn green" type="button" id="green" aria-label="Green"></button>
                    <button class="btn purple" type="button" id="purple" aria-label="Purple"></button>
                </div>

                <div class="board-hub" aria-hidden="true">
                    <span class="board-hub-dot dot-red"></span>
                    <span class="board-hub-dot dot-yellow"></span>
                    <span class="board-hub-dot dot-green"></span>
                    <span class="board-hub-dot dot-purple"></span>
                </div>

            </div>
        </div>
    </main>

    <script src="js/audio.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
